# Render 배포 설계도(Blueprint).
#
# 대시보드에서 New > Blueprint 를 고르고 이 저장소를 연결하면, 렌더가 이
# 파일을 읽어 서비스를 알아서 만든다. 클릭으로 하나씩 채우는 것보다 실수가 적다.
#
# 자세한 절차는 docs/배포하기_Render.md 참고.

services:
  - type: web
    name: hr-report-engine
    runtime: python
    plan: free
    region: singapore                 # 한국에서 가장 가까운 지역
    branch: main

    buildCommand: pip install -r requirements.txt
    # $PORT 는 렌더가 정해 준다. 고정 포트를 쓰면 뜨지 않는다.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 120

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.10.11"

      # ── 반드시 대시보드에서 손으로 넣어야 하는 것 ──────────────────────
      # sync:false 는 "값은 여기 안 적는다, 사람이 넣는다"는 뜻이다.
      # 키와 비밀번호는 절대 이 파일에 적지 않는다 — 깃에 올라간다.
      - key: HR_AUTH_PASS               # 없으면 바깥에서 아예 안 열린다
        sync: false
      - key: ANTHROPIC_API_KEY          # 없으면 목(mock) 문장으로 돈다
        sync: false

      # ── 메일 발송을 쓸 때만 ────────────────────────────────────────
      - key: HR_MAIL_ENABLED
        value: "0"
      - key: HR_SMTP_HOST
        sync: false
      - key: HR_SMTP_PORT
        sync: false
      - key: HR_SMTP_USER
        sync: false
      - key: HR_SMTP_PASS
        sync: false

      # ── 동작 설정 ────────────────────────────────────────────────
      - key: HR_AUTH_USER
        value: hrd
      - key: HR_MODEL
        value: claude-sonnet-5
      - key: HR_EFFORT
        value: medium
      - key: HR_CONCURRENCY
        value: "4"
      - key: HR_STORAGE
        value: /var/data/storage
      - key: HR_DB_URL
        value: sqlite:////var/data/hr_report.db

    # 무료 요금제에서는 디스크를 붙일 수 없다. 그러면 서버가 다시 뜰 때마다
    # DB 와 업로드 파일이 사라진다 — 시연에는 문제없지만 실제 운용은 못 한다.
    # 유료로 올려 디스크를 쓰려면 아래 세 줄의 주석을 풀고, 무료로 쓰려면
    # 위의 HR_STORAGE·HR_DB_URL 을 ./storage 와 sqlite:///./hr_report.db 로 바꾼다.
    #
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
