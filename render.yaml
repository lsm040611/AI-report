# Render 배포 설계도(Blueprint).
#
# 대시보드에서 New > Blueprint 를 고르고 이 저장소를 연결하면, 렌더가 이
# 파일을 읽어 서비스를 알아서 만든다. 클릭으로 하나씩 채우는 것보다 실수가 적다.
#
# 자세한 절차는 docs/배포하기_Render.md 참고.

services:
  - type: web
    name: hr-report-engine
    runtime: python
    plan: free
    region: singapore                 # 한국에서 가장 가까운 지역
    branch: main

    buildCommand: pip install -r requirements.txt
    # $PORT 는 렌더가 정해 준다. 고정 포트를 쓰면 뜨지 않는다.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 120

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.10.11"

      # ── 반드시 대시보드에서 손으로 넣어야 하는 것 ──────────────────────
      # sync:false 는 "값은 여기 안 적는다, 사람이 넣는다"는 뜻이다.
      # 키와 비밀번호는 절대 이 파일에 적지 않는다 — 깃에 올라간다.
      - key: HR_AUTH_PASS               # 없으면 바깥에서 아예 안 열린다
        sync: false
      - key: ANTHROPIC_API_KEY          # 없으면 목(mock) 문장으로 돈다
        sync: false

      # ── 메일 발송 ──────────────────────────────────────────────────
      # 켜 두되, 아래 네 칸을 채우기 전에는 실제로 보내지 않는다.
      # 그때는 '미리보기' 로만 돌고 화면에도 그렇게 표시된다 —
      # 안 간 메일을 갔다고 보여 주는 것보다 낫다.
      - key: HR_MAIL_ENABLED
        value: "1"
      - key: HR_SMTP_HOST
        value: smtp.gmail.com
      - key: HR_SMTP_PORT
        value: "587"
      - key: HR_SMTP_USER
        sync: false           # 보내는 계정 (예: ggdltmdals@gmail.com)
      - key: HR_SMTP_PASS
        sync: false           # 구글 앱 비밀번호 16자리

      # ── 동작 설정 ────────────────────────────────────────────────
      - key: HR_AUTH_USER
        value: hrd
      - key: HR_MODEL
        value: claude-sonnet-5
      - key: HR_EFFORT
        value: medium
      - key: HR_CONCURRENCY
        value: "8"

    # 자료를 어디에 둘지는 여기서 정하지 않는다. config.py 가 /var/data 가
    # 붙어 있는지 직접 보고 고른다 — 무료면 현재 폴더, 디스크를 붙이면 디스크.
    # 설정 두 칸을 사람이 맞춰 고치게 하면 반드시 어긋난다.
    #
    # 무료 요금제에서는 디스크를 붙일 수 없어, 서버가 다시 뜰 때마다 DB 와
    # 업로드 파일이 사라진다. 시연에는 문제없지만 실제 운용은 못 한다.
    # 유료로 올렸다면 아래 네 줄의 주석만 풀면 된다. 그 외에 고칠 것은 없다.
    #
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
